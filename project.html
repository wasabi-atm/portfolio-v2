<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blogs – Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="./dist/output.css" rel="stylesheet">
  <link id="site-favicon" rel="icon" type="image/png" href="assets/faviconneu.png">
  <script>
    (function () {
      try {
        var link = document.querySelector('link#site-favicon');
        if (!link) {
          link = document.createElement('link');
          link.id = 'site-favicon';
          link.rel = 'icon';
          link.type = 'image/png';
          document.head.appendChild(link);
        }
        var onCarte = /^carte\./i.test(location.hostname) || /(^|\.)carte\.wirawibisana\.com$/i.test(location.hostname);
        link.href = onCarte ? 'assets/carteFavicon.png' : 'assets/faviconneu.png';
      } catch (e) { }
    })();
  </script>
</head>

<body class="min-h-dvh bg-zinc-100 antialiased font-['Roboto']">
  <div id="site-nav"></div>

  <!-- Main content container -->
  <main id="project-detail" class="w-full min-h-screen relative"></main>

  <script type="module" src="js/main.js"></script>
</body>

</html>
