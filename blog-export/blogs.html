<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article – Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {} } }
  </script>
  <link href="./dist/output.css" rel="stylesheet">
  <link id="site-favicon" rel="icon" type="image/png" href="assets/faviconneu.png">
  <script>
    (function () {
      try {
        var link = document.querySelector('link#site-favicon');
        if (!link) {
          link = document.createElement('link');
          link.id = 'site-favicon';
          link.rel = 'icon';
          link.type = 'image/png';
          document.head.appendChild(link);
        }
        var onCarte = /^carte\./i.test(location.hostname) || /(^|\.)carte\.wirawibisana\.com$/i.test(location.hostname);
        link.href = onCarte ? 'assets/carteFavicon.png' : 'assets/faviconneu.png';
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-dvh bg-zinc-100 antialiased font-['Roboto']">
  <div id="site-nav"></div>

  <main class="mx-auto w-full max-w-[1100px] px-6 sm:px-8 md:px-12 lg:px-24 xl:px-28 2xl:px-32 mt-12 sm:mt-16 md:mt-24 lg:mt-28 py-12 sm:py-12 md:py-24 space-y-4 sm:space-y-4 md:space-y-6">
    <header class="px-0">
      <h1 class="text-4xl font-light"><span class="text-zinc-400">I Love </span><span class="text-black">Writing</span></h1>
      <nav id="blogs-filters" class="mt-3 flex flex-wrap items-center gap-2 text-sm"></nav>
    </header>

    <section id="blogs-list" class="px-0 divide-y divide-zinc-200 bg-white/0"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
