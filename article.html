<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogs – Portfolio</title>

    <!-- Prevent dark mode flash - apply theme before CSS loads -->
    <script>
        (function () {
            try {
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) { }
        })();
    </script>

    <!-- Preload local Inter font for performance -->
    <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/assets/fonts/fonts.css" rel="stylesheet">
    <link href="dist/output.css" rel="stylesheet">
    <link id="site-favicon" rel="icon" type="image/png" href="assets/faviconneu.png">
    <script>
        (function () {
            try {
                var link = document.querySelector('link#site-favicon');
                if (!link) {
                    link = document.createElement('link');
                    link.id = 'site-favicon';
                    link.rel = 'icon';
                    link.type = 'image/png';
                    document.head.appendChild(link);
                }
                var onCarte = /^carte\./i.test(location.hostname) || /(^|\.)carte\.wirawibisana\.com$/i.test(location.hostname);
                link.href = onCarte ? 'assets/carteFavicon.png' : 'assets/faviconneu.png';
            } catch (e) { }
        })();
    </script>
</head>

<body class="min-h-dvh bg-zinc-50 dark:bg-zinc-900 text-black dark:text-white antialiased font-sans"
    style="font-family: 'Inter', sans-serif;">
    <div id="sidebar-root"></div>

    <!-- Main content container -->
    <main id="blog-detail" class="w-full min-h-screen relative"></main>

    <div id="mobile-footer-root" class="lg:hidden"></div>
    <script type="module" src="dist/js/bundle.js"></script>
</body>

</html>
