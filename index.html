<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wira Wibisana Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { content: '#000000', muted: '#6A6A6A', connect: '#2A9320' }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet" />
  <link href="/dist/output.css" rel="stylesheet">
</head>
<body class="min-h-dvh bg-zinc-100 antialiased font-['Roboto']">

  <!-- Global nav will be injected by app.js -->
  <div id="site-nav"></div>

  <!-- Greeting (hero) -->
  <main class="mx-auto w-full max-w-[1100px] px-6 sm:px-8 md:px-12 lg:px-24 xl:px-28 2xl:px-32 mt-12 sm:mt-16 md:mt-24 lg:mt-28 py-12 sm:py-12 md:py-24 lg:py-32 space-y-2 sm:space-y-4 md:space-y-6 lg:space-y-8">
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-black text-2xl font-light">Hi, I’m </span><span class="text-black text-2xl font-semibold">Wira Wibisana</span>
    </div>
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-black text-2xl font-semibold">Product Designer</span>
    </div>
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-black text-2xl font-light">Focused on building delightful </span><span class="text-black text-2xl font-semibold">Apple-first experiences</span>
    </div>
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-black text-2xl font-light">Ready to craft products people </span><span class="text-black text-2xl font-semibold">truly love</span>
    </div>
  </main>

  <!-- Section separator -->
  <hr class="mx-auto w-full max-w-[1100px] border-t border-zinc-200/80 my-4 sm:my-6 md:my-10" />


  <!-- Design works grid: 1 wide + 2 half -->
  <section class="mx-auto w-full max-w-[1100px] px-6 sm:px-8 md:px-12 lg:px-24 xl:px-28 2xl:px-32 py-16 md:py-24">
    <h2 class="text-xl sm:text-2xl leading-snug text-content mb-6 md:mb-8">Design Showcase</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
      <!-- Wide tile (spans 2 cols on md+) -->
      <figure class="md:col-span-2 overflow-hidden rounded-2xl">
        <img src="assets/Video Mockup WebP from ezgif.webp" alt="Design work" class="block w-full aspect-video object-cover rounded-2xl" />
        <figcaption class="mt-2 text-sm sm:text-base text-muted leading-snug pl-3 md:pl-4">Brief description of this design piece goes here.</figcaption>
      </figure>
      <!-- Two 50:50 tiles -->
      <figure class="overflow-hidden rounded-2xl">
        <img src="assets/Video Mockup WebP from ezgif.webp" alt="Design work" class="block w-full aspect-video object-cover rounded-2xl" />
        <figcaption class="mt-2 text-sm sm:text-base text-muted leading-snug pl-3 md:pl-4">Short description or context for this animation.</figcaption>
      </figure>
      <figure class="overflow-hidden rounded-2xl">
        <img src="assets/Video Mockup WebP from ezgif.webp" alt="Design work" class="block w-full aspect-video object-cover rounded-2xl" />
        <figcaption class="mt-2 text-sm sm:text-base text-muted leading-snug pl-3 md:pl-4">Another placeholder description to explain the outcome.</figcaption>
      </figure>
    </div>
  </section>

  <!-- Section separator -->
  <hr class="mx-auto w-full max-w-[1100px] border-t border-zinc-200/80 my-8 sm:my-10 md:my-14" />

  <!-- Case studies (pinned from Builder) -->
  <section class="mx-auto w-full max-w-[1100px] px-6 sm:px-8 md:px-12 lg:px-24 xl:px-28 2xl:px-32 pt-8 md:pt-12 pb-8 md:pb-14">
    <div class="flex items-baseline justify-between mb-4 md:mb-6">
      <h2 class="text-xl sm:text-2xl leading-snug text-content">Favorite Case Studies</h2>
      <a href="blogs.html" class="text-sm md:text-base text-zinc-500 hover:text-black underline-offset-4 hover:underline">See All →</a>
    </div>
    <div id="home-pinned-grid" class="px-0 divide-y divide-zinc-200 bg-white/0"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
