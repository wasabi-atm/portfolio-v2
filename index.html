<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wira Wibisana Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { content: '#000000', muted: '#6A6A6A', connect: '#2A9320' }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="./dist/output.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="min-h-dvh bg-zinc-100 antialiased font-['Roboto']">

  <!-- Global nav will be injected by app.js -->
  <div id="site-nav"></div>

  <!-- Greeting (hero) -->
  <main class="mx-auto w-full max-w-[1100px] px-6 sm:px-8 md:px-12 lg:px-24 xl:px-28 2xl:px-32 mt-12 sm:mt-16 md:mt-24 lg:mt-28 py-10 sm:py-10 md:py-20 lg:py-28 space-y-2 sm:space-y-4 md:space-y-6 lg:space-y-8">
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-zinc-400 text-2xl">Hi, I’m </span><span class="text-black text-2xl">Wira Wibisana</span>
    </div>
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-black text-2xl">Product Designer</span>
    </div>
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-zinc-400 text-2xl">Focused on building delightful </span><span class="text-black text-2xl">Apple-first experiences</span>
    </div>
    <div class="justify-start leading-tight tracking-tight">
      <span class="text-zinc-400 text-2xl">Ready to craft products people </span><span class="text-black text-2xl">truly love</span>
    </div>

    <!-- CTA: Case Studies -->
    <div class="pt-2 sm:pt-3 md:pt-4">
      <a href="/blogs?tag=Case%20Studies" aria-label="View Case Studies"
         class="inline-flex items-center rounded-full border border-zinc-300/70 bg-white/70 text-zinc-800 px-5 py-2 text-sm sm:text-base font-medium hover:bg-zinc-100 hover:text-black hover:border-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:ring-offset-2 focus:ring-offset-zinc-100 transition-colors">
        Case Studies &gt;
      </a>
    </div>

    <!-- App icon stack / mobile grid -->
    <div class="pt-2">
      <!-- Mobile/Tablet: horizontal row with fixed spacing (no hover) -->
      <div class="lg:hidden">
        <div class="flex items-center gap-4">
          <a href="https://swiftsekai.framer.website/" target="_blank" rel="noopener" aria-label="Open Swisekai website"
             class="flex items-center justify-center h-16 w-16 rounded-2xl border border-zinc-300/70 bg-white/80 hover:bg-zinc-100 active:bg-zinc-200 transition">
            <img src="assets/Swisekai.png" alt="Swisekai app icon" class="h-10 w-10 object-contain" />
          </a>
          <a href="carte.html" aria-label="Open Carte case study"
             class="flex items-center justify-center h-16 w-16 rounded-2xl border border-zinc-300/70 bg-white/80 hover:bg-zinc-100 active:bg-zinc-200 transition">
            <img src="assets/carteIcon.png" alt="Carte app icon" class="h-10 w-10 object-contain" />
          </a>
        </div>
      </div>

      <!-- Desktop (lg+): stacked icons that expand on hover -->
      <div class="hidden lg:inline-block relative -m-3 pl-3 pr-20 sm:pr-24 md:pr-28 pt-1 group">
        <div class="relative w-14 sm:w-16 md:w-20 aspect-square">
          <!-- Left (Swisekai) -->
          <a href="https://swiftsekai.framer.website/" title="Swisekai" aria-label="Open Swisekai website" target="_blank" rel="noopener" class="absolute inset-0 m-auto flex items-center justify-center h-[64%] w-[64%] z-10 opacity-80 rotate-[14deg] -translate-x-1 -translate-y-1 scale-95 transition-all duration-300 ease-out group-hover:opacity-100 group-hover:rotate-0 group-hover:translate-x-[90%] group-hover:translate-y-0 group-hover:scale-100">
            <img src="assets/Swisekai.png" alt="Swisekai app icon" class="peer h-full w-full object-contain" />
            <span role="tooltip" class="pointer-events-none absolute left-1/2 top-full z-50 mt-2 -translate-x-1/2 translate-y-1 opacity-0 transition duration-200 peer-hover:opacity-100 peer-hover:translate-y-0 peer-focus-visible:opacity-100">
              <span class="block rounded-md border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-700 shadow-md whitespace-nowrap">Swisekai - an engaging way to learn Swift</span>
            </span>
          </a>
          <!-- Center (Carte) -->
          <a href="carte.html" aria-label="Open Carte case study" class="absolute inset-0 m-auto flex items-center justify-center h-[64%] w-[64%] z-20 rotate-[-2deg] transition-all duration-300 ease-out group-hover:rotate-0 group-hover:translate-x-0">
            <img src="assets/carteIcon.png" alt="Carte app icon" class="peer h-full w-full object-contain" />
            <span role="tooltip" class="pointer-events-none absolute left-1/2 top-full z-50 mt-2 -translate-x-1/2 translate-y-1 opacity-0 transition duration-200 peer-hover:opacity-100 peer-hover:translate-y-0 peer-focus-visible:opacity-100">
              <span class="block rounded-md border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-700 shadow-md whitespace-nowrap">Scan Business Cards - Carte</span>
            </span>
          </a>
          <!-- Right placeholder removed as requested -->
        </div>
      </div>
    </div>
  </main>

  <!-- Section separator -->
  <hr class="mx-auto w-full max-w-[1100px] border-t border-zinc-200/80 my-4 sm:my-6 md:my-10" />


  <!-- Design works grid: 2x2 -->
  <section class="mx-auto w-full max-w-[1100px] px-6 sm:px-8 md:px-12 lg:px-24 xl:px-28 2xl:px-32 py-12 md:py-20">
    <h2 class="text-xl sm:text-2xl leading-snug text-content mb-6 md:mb-8">Design Showcase</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-10 md:gap-x-8 md:gap-y-8">
      <!-- 1: Carte 1.1 -->
      <figure class="rounded-2xl relative">
        <video class="block w-full aspect-[4/3] object-cover rounded-2xl" src="assets/Carte1.1Showcase.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Carte 1.1 demo"></video>
        <figcaption class="mt-2 text-sm sm:text-base text-muted leading-snug pl-3 md:pl-4">
          Carte 1.1: Notification UX,
          <span class="relative inline-block group">
            <span class="underline underline-offset-4 decoration-zinc-400 group-hover:decoration-black cursor-help">Camera Control</span>
            <span role="tooltip" class="pointer-events-none absolute left-1/2 top-full z-50 mt-2 w-[min(90vw,260px)] -translate-x-1/2 translate-y-1 opacity-0 group-hover:opacity-100 group-hover:translate-y-0 transition duration-200">
              <span class="block rounded-md border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-700 shadow-md">
                The iPhone 16 family and up has a dedicated Camera Control button on the right side of the device that functions as a physical shutter button
              </span>
            </span>
          </span>
          , more Liquid Glass.
        </figcaption>
      </figure>

      <!-- 2: Carte -->
      <figure class="rounded-2xl relative">
        <video class="block w-full aspect-[4/3] object-cover rounded-2xl" src="assets/Carte.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Carte demo"></video>
        <figcaption class="mt-2 text-sm sm:text-base text-muted leading-snug pl-3 md:pl-4">
          Carte is an <b>iOS app</b> that uses Apple's newest 
          <span class="relative inline-block group">
            <span class="underline underline-offset-4 decoration-zinc-400 group-hover:decoration-black cursor-help">Liquid Glass</span>
            <span role="tooltip" class="pointer-events-none absolute left-1/2 top-full z-50 mt-2 w-[min(90vw,260px)] -translate-x-1/2 translate-y-1 opacity-0 group-hover:opacity-100 group-hover:translate-y-0 transition duration-200">
              <span class="block rounded-md border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-700 shadow-md">
                Liquid Glass is a dynamic, translucent material with depth, subtle blur, and specular highlights that responds to motion and context.
              </span>
            </span>
          </span>
          design.
        </figcaption>
      </figure>

      <!-- 3: Stoa -->
      <figure class="rounded-2xl relative">
        <video class="block w-full aspect-[4/3] object-cover rounded-2xl" src="assets/Stoa.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Stoa demo"></video>
        <figcaption class="mt-2 text-sm sm:text-base text-muted leading-snug pl-3 md:pl-4">
          Stoa is an 
          <span class="relative inline-block group">
            <span class="underline underline-offset-4 decoration-zinc-400 group-hover:decoration-black cursor-help">accessibility friendly</span>
            <span role="tooltip" class="pointer-events-none absolute left-1/2 top-full z-50 mt-2 w-[min(90vw,260px)] -translate-x-1/2 translate-y-1 opacity-0 group-hover:opacity-100 group-hover:translate-y-0 transition duration-200">
              <span class="block rounded-md border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-700 shadow-md">
                Designed with inclusive color contrast, large tap targets, Dynamic Type, VoiceOver labels, and reduced motion support.
              </span>
            </span>
          </span>
          &nbsp;<b>iOS app</b> for mindfulness with stoic philosophy.
        </figcaption>
      </figure>

      <!-- 4: Swisekai -->
      <figure class="rounded-2xl relative">
        <video class="block w-full aspect-[4/3] object-cover rounded-2xl" src="assets/Swisekai.mp4" autoplay muted loop playsinline preload="metadata" poster="assets/Swisekai.webp" aria-label="Swisekai demo"></video>
        <figcaption class="mt-2 text-sm sm:text-base text-muted leading-snug pl-3 md:pl-4">
          SwiSekai is an 
          <span class="relative inline-block group">
            <span class="underline underline-offset-4 decoration-zinc-400 group-hover:decoration-black cursor-help">Ultra-responsive</span>
            <span role="tooltip" class="pointer-events-none absolute left-1/2 top-full z-50 mt-2 w-[min(90vw,260px)] -translate-x-1/2 translate-y-1 opacity-0 group-hover:opacity-100 group-hover:translate-y-0 transition duration-200">
              <span class="block rounded-md border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-700 shadow-md">
                Ultra-responsive means buttery-smooth interactions, minimal input latency, and layouts that adapt instantly across window sizes and system settings.
              </span>
            </span>
          </span>
          <b>MacOS app</b> designed to be a companion for new programmers.
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- Section separator -->
  <hr class="mx-auto w-full max-w-[1100px] border-t border-zinc-200/80 my-8 sm:my-10 md:my-14" />

  

  <!-- Case studies (pinned from Builder) -->
  <section class="mx-auto w-full max-w-[1100px] px-6 sm:px-8 md:px-12 lg:px-24 xl:px-28 2xl:px-32 pt-6 md:pt-10 pb-6 md:pb-12">
    <div class="flex items-baseline justify-between mb-4 md:mb-6">
      <h2 class="text-xl sm:text-2xl leading-snug text-content">Favorite Case Studies</h2>
      <a href="/blogs" class="text-sm md:text-base text-zinc-500 hover:text-black underline-offset-4 hover:underline">See All →</a>
    </div>
    <div id="home-pinned-grid" class="px-0 divide-y divide-zinc-200 bg-white/0"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
